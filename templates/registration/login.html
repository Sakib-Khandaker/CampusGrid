{% extends 'registration/registration_base.html' %}
{% load i18n static %}
{% block title %}{% trans 'JUST CSE AMS - Login' %}{% endblock title %}

{% block content %}

<style>
  body {
    background: url("{% static 'img/just.jpg' %}") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Segoe UI', sans-serif;
  }

  .login-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(
  rgba(0,0,0,0.25),
  rgba(0,0,0,0.45)
);
    backdrop-filter: blur(0px);
  }

  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 480px;
    border-radius: 22px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    padding: 40px;
    color: #fff;
  }

  .form-title {
    font-size: 32px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 35px;
  }

  .form-group label {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 10px;
    display: block;
  }

  .form-control {
    border-radius: 14px;
    padding: 16px;
    font-size: 18px;
    border: none;
    outline: none;
    width: 100%;
  }

  .form-control:focus {
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.4);
  }

  .btn-login {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: #fff;
    font-weight: 800;
    font-size: 18px;
    margin-top: 18px;
    transition: 0.3s ease;
  }

  .btn-login:hover {
    transform: scale(1.03);
    box-shadow: 0 10px 25px rgba(0,114,255,0.4);
  }

  .login-bottom {
    text-align: center;
    margin-top: 22px;
  }

  .login-bottom a {
    color: #fff;
    font-size: 16px;
    text-decoration: none;
  }

  .login-bottom a:hover {
    text-decoration: underline;
  }

  /* PASSWORD WRAPPER FIX */
  .password-wrapper {
    position: relative;
  }

  .password-wrapper input {
    padding-right: 50px; /* space for eye icon */
  }

  .toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #444;
    font-size: 18px;
  }
</style>

<div class="login-overlay"></div>

<div class="login-wrapper">
  <div class="login-card">

    <div class="form-title">
      <i class="fas fa-lock me-2"></i>
      {% trans 'Sign in' %}
    </div>

    <form action="" method="POST" id="login-form" autocomplete="off">
  <input type="text" name="fakeuser" style="display:none">
  <input type="password" name="fakepass" style="display:none">
      {% csrf_token %}

      <div class="form-group mb-3">
        <label>{% trans 'ID Number' %}</label>
        <input type="text" name="username" class="form-control" required
       autocomplete="new-username"
       autocapitalize="off"
       spellcheck="false">
      </div>

      <div class="form-group mb-3 password-wrapper">
        <label>{% trans 'Password' %}</label>
        <input type="password" name="password" id="password_id" class="form-control" required
       autocomplete="new-password"
       autocapitalize="off"
       spellcheck="false">

        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
      </div>

      <button type="submit" class="btn-login" id="login-btn">
        SIGN IN
      </button>
    </form>

    <div class="login-bottom">
      <a href="{% url 'password_reset' %}">
        {% trans 'Forgot password ?' %}
      </a>
    </div>

  </div>
</div>

{% endblock %}

{% block js %}

<script>
  // Submit loading
  $('#login-form').submit(function () {
    $('#login-btn').html('Signing you in...')
    $('#login-btn').addClass('disabled')
  })

  // Show / Hide password
  $('#togglePassword').on('click', function () {
    const input = $('#password_id');
    const type = input.attr('type') === 'password' ? 'text' : 'password';
    input.attr('type', type);

    $(this).toggleClass('fa-eye fa-eye-slash');
  });
</script>

{% endblock %}
