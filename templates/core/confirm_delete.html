{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">

    <h3>Confirm Delete</h3>

    <p>Are you sure you want to delete this item?</p>

    <form method="post">
        {% csrf_token %}
        <a href="{% url 'notices' %}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>

</div>
{% endblock %}
