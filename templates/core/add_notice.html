{% extends "base.html" %}
{% load i18n %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-3">Add Notice</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Notice
        </button>
    </form>

</div>

{% endblock %}
